<div class="dropdown">
  <button
    class="btn btn-link text-white position-relative"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
  >
    <i class="bi bi-bell-fill fs-5"></i>
    @if (notificationService.unreadCount() > 0) {
      <span
        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
      >
        {{ notificationService.unreadCount() }}
      </span>
    }
  </button>
  <div class="dropdown-menu dropdown-menu-end shadow notification-panel p-0">
    <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
      <span class="fw-semibold">Notifications</span>
      <button class="btn btn-sm btn-link p-0" (click)="markAllAsRead()">Mark all read</button>
    </div>
    <div class="notification-list">
      @for (n of notificationService.notifications(); track n.id) {
        <a
          class="dropdown-item py-2 border-bottom"
          [class.bg-light]="!n.read"
          (click)="onNotificationClick(n.id, n.read)"
        >
          <div class="d-flex justify-content-between">
            <strong class="small">{{ n.title }}</strong>
            @if (!n.read) {
              <span class="badge bg-primary rounded-pill">new</span>
            }
          </div>
          <div class="small text-muted text-wrap">{{ n.message }}</div>
          <div class="small text-muted">{{ timeAgo(n.createdAt) }}</div>
        </a>
      } @empty {
        <div class="text-muted text-center py-3 small">No notifications yet</div>
      }
    </div>
  </div>
</div>
